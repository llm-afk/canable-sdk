[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canable-sdk"
version = "0.1.4"
description = "Windows native WinUSB SDK for ElmueSoft CANable 2.5 Candlelight"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license-files = ["THIRD_PARTY_NOTICES.md"]

[project.urls]
Repository = "https://github.com/llm-afk/canable-sdk"

[project.scripts]
canable = "canable.__main__:main"
canable25 = "canable.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
canable = ["py.typed"]
canable25 = ["py.typed"]
